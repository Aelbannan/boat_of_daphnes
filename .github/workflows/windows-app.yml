# Builds the Windows app (boat-of-daphnes.exe) from this repository alone: no disc, no game code. The game module is
# translated from each player's own disc and is never built here.
name: Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        shell: cmd
        run: python scripts\windows\build_app_only.py --jobs 4
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: boat-of-daphnes-app-windows-x64
          path: |
            build/windows/app/*.exe
            build/windows/app/*.dll
          if-no-files-found: error
          retention-days: 14
