# The Anchor online play server: runs it locally (wrangler dev) and plays the room test against it.
name: Anchor server

on:
  push:
    branches: [main]
    paths: ["server/anchor/**", ".github/workflows/anchor-server.yml"]
  pull_request:
    paths: ["server/anchor/**", ".github/workflows/anchor-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server/anchor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/anchor/package-lock.json
      - run: npm ci
      - name: Start the server
        run: |
          npx wrangler dev --port 8787 --local > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8787/; then exit 0; fi
            sleep 2
          done
          cat wrangler.log
          exit 1
      - name: Room test
        run: npm test
      - name: Server log
        if: always()
        run: cat wrangler.log || true
